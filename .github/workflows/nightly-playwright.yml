name: Nightly Playwright tests

on:
  schedule:
    # 23:00 UTC is 00:00/01:00 in Europe/Amsterdam depending on DST.
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ITMATT_URL: ${{ secrets.ITMATT_URL }}
      PREDES_URL: ${{ secrets.PREDES_URL }}
      API_KEY: ${{ secrets.API_KEY }}
      MOAS_URL: ${{ secrets.MOAS_URL }}
      MOAS_USER: ${{ secrets.MOAS_USER }}
      MOAS_PASSWORD: ${{ secrets.MOAS_PASSWORD }}
      VIDEO_ON_FAILURE: retain-on-failure

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        run: npm run bddgen && npx playwright test

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Playwright and Allure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-reports
          path: |
            allure-report/
            allure-results/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Upload Allure report for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy-report:
    if: always() && needs.test.result != 'cancelled'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment1.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Allure report to GitHub Pages (attempt 1)
        id: deployment1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying Pages deployment
        if: steps.deployment1.outcome == 'failure'
        run: sleep 15

      - name: Deploy Allure report to GitHub Pages (attempt 2)
        id: deployment2
        if: steps.deployment1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final Pages deployment attempt
        if: steps.deployment2.outcome == 'failure'
        run: sleep 30

      - name: Deploy Allure report to GitHub Pages (attempt 3)
        id: deployment3
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
